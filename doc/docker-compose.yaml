# Example Docker Compose configuration for ImageShare

# Setup guide: https://github.com/corbindavenport/imageshare/blob/main/doc/SETUP.md
# More information on settings: https://github.com/corbindavenport/imageshare/blob/main/doc/SETTINGS.md

services:
  imageshare:
    image: docker.io/corbindavenport/imageshare:latest
    container_name: imageshare
    restart: unless-stopped
    volumes:
      ## Mount the uploads folder to the host system
      #- ./uploads:/app/uploads
    networks:
     - imageshare
    environment:
      # The file size limit for uploads, measured in Megabytes. This is the only setting that is required.
      UPLOAD_LIMIT: 20
      # The time delay to automatically delete files, measured in minutes. If you are running a public server, this should be a low number to prevent possibly-malicious content from remaining accessible.
      AUTODELETE_TIME: 2
      ## The web domain for the ImageShare server, used in generating QR codes, image shortlinks, and other functions. If left blank, ImageShare will use the IP address from the connected client.
      #DOMAIN: yourdomain.com
      ## The domain used for Plausible Analytics. The domain used for Plausible Analytics, the feature is turned off if the setting isn't defined.
      #PLAUSIBLE_DOMAIN: yourdomain.com
      ## The time delay to automatically delete files, measured in minutes. If you are running a public server, this should be a low number to prevent possibly-malicious content from remaining accessible for too long.
      ## The client ID used for Imgur upload support. The feature is turned off if an ID is not provided.
      #IMGUR_KEY: yourclientidgoeshere
    ports:
      # The first number is the port on the host, so ImageShare would be accessible from localhost:8080
      - 8080:80

networks:
  imageshare:
    ipam:
      driver: default
      config:
        - subnet: "172.18.0.0/16"
          gateway: "172.18.0.1"